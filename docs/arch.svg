<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b4b9c7"/></marker>
  </defs>
  <rect width="960" height="520" rx="16" fill="#0c0d12"/>
  <text x="40" y="52" fill="#f4f5f8" font-family="Georgia, serif" font-size="28">How Harper works</text>
  <text x="40" y="78" fill="#7e8596" font-size="13">The voice agent never edits the plan. It calls tools, and the rules engine checks every change.</text>

  <!-- student -->
  <rect x="40" y="130" width="170" height="90" rx="12" fill="#12141c" stroke="#3a3f4d"/>
  <text x="125" y="168" text-anchor="middle" fill="#f4f5f8" font-size="16" font-weight="700">Student</text>
  <text x="125" y="192" text-anchor="middle" fill="#b4b9c7" font-size="12">talks out loud</text>

  <!-- elevenlabs -->
  <rect x="290" y="110" width="250" height="130" rx="12" fill="#1a1024" stroke="#a78bfa"/>
  <text x="415" y="142" text-anchor="middle" fill="#c4b5fd" font-size="12" font-weight="700" letter-spacing="1">ELEVENLABS AGENT</text>
  <text x="415" y="170" text-anchor="middle" fill="#f4f5f8" font-size="14">speech → text</text>
  <text x="415" y="192" text-anchor="middle" fill="#f4f5f8" font-size="14">LLM decides which tool to call</text>
  <text x="415" y="214" text-anchor="middle" fill="#f4f5f8" font-size="14">text → Harper's voice</text>

  <!-- planner -->
  <rect x="620" y="110" width="300" height="130" rx="12" fill="#1c0f10" stroke="#b81d24"/>
  <text x="770" y="142" text-anchor="middle" fill="#ff8a8f" font-size="12" font-weight="700" letter-spacing="1">PLANNER.JS · RULES ENGINE</text>
  <text x="770" y="170" text-anchor="middle" fill="#f4f5f8" font-size="14">prerequisites · quarters offered</text>
  <text x="770" y="192" text-anchor="middle" fill="#f4f5f8" font-size="14">study abroad · credit · workload</text>
  <text x="770" y="214" text-anchor="middle" fill="#f4f5f8" font-size="14">auto-fix · double majors</text>

  <!-- arrows top row -->
  <line x1="210" y1="165" x2="286" y2="165" stroke="#b4b9c7" stroke-width="2" marker-end="url(#a)"/>
  <line x1="286" y1="190" x2="214" y2="190" stroke="#b4b9c7" stroke-width="2" marker-end="url(#a)"/>
  <line x1="540" y1="160" x2="616" y2="160" stroke="#b4b9c7" stroke-width="2" marker-end="url(#a)"/>
  <text x="578" y="150" text-anchor="middle" fill="#7e8596" font-size="11">tool call</text>
  <line x1="616" y1="195" x2="544" y2="195" stroke="#b4b9c7" stroke-width="2" marker-end="url(#a)"/>
  <text x="578" y="214" text-anchor="middle" fill="#7e8596" font-size="11">what changed</text>

  <!-- catalog -->
  <rect x="620" y="300" width="300" height="80" rx="12" fill="#12141c" stroke="#3a3f4d"/>
  <text x="770" y="333" text-anchor="middle" fill="#f4f5f8" font-size="15" font-weight="700">catalog.js</text>
  <text x="770" y="356" text-anchor="middle" fill="#b4b9c7" font-size="12">46 majors · Core options · 24 study abroad programs</text>
  <line x1="770" y1="300" x2="770" y2="244" stroke="#b4b9c7" stroke-width="2" marker-end="url(#a)"/>

  <!-- transcript -->
  <rect x="290" y="300" width="250" height="80" rx="12" fill="#12141c" stroke="#3a3f4d"/>
  <text x="415" y="333" text-anchor="middle" fill="#f4f5f8" font-size="15" font-weight="700">Transcript upload</text>
  <text x="415" y="356" text-anchor="middle" fill="#b4b9c7" font-size="12">read in the browser, never uploaded</text>
  <path d="M470,300 C500,262 600,262 650,244" fill="none" stroke="#b4b9c7" stroke-width="2" marker-end="url(#a)"/>

  <!-- grid -->
  <rect x="40" y="300" width="170" height="160" rx="12" fill="#12141c" stroke="#38bdf8"/>
  <text x="125" y="333" text-anchor="middle" fill="#f4f5f8" font-size="15" font-weight="700">4-year grid</text>
  <g>
    <rect x="62" y="350" width="40" height="22" rx="4" fill="#fb7185" opacity=".8"/><rect x="108" y="350" width="40" height="22" rx="4" fill="#38bdf8" opacity=".8"/><rect x="154" y="350" width="34" height="22" rx="4" fill="#fbbf24" opacity=".8"/>
    <rect x="62" y="378" width="40" height="22" rx="4" fill="#38bdf8" opacity=".8"/><rect x="108" y="378" width="40" height="22" rx="4" fill="#fb7185" opacity=".8"/><rect x="154" y="378" width="34" height="22" rx="4" fill="#38bdf8" opacity=".8"/>
    <rect x="62" y="406" width="40" height="22" rx="4" fill="#fbbf24" opacity=".8"/><rect x="108" y="406" width="40" height="22" rx="4" fill="#38bdf8" opacity=".8"/><rect x="154" y="406" width="34" height="22" rx="4" fill="#fb7185" opacity=".8"/>
  </g>
  <text x="125" y="448" text-anchor="middle" fill="#7e8596" font-size="11">updates live · export for adviser</text>
  <path d="M770,244 C770,280 300,420 214,400" fill="none" stroke="#b4b9c7" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="470" y="438" text-anchor="middle" fill="#7e8596" font-size="11">every change redraws the grid</text>

  <!-- legend -->
  <circle cx="300" cy="488" r="5" fill="#fb7185"/><text x="312" y="492" fill="#b4b9c7" font-size="12">Core</text>
  <circle cx="370" cy="488" r="5" fill="#38bdf8"/><text x="382" y="492" fill="#b4b9c7" font-size="12">Major</text>
  <circle cx="445" cy="488" r="5" fill="#fbbf24"/><text x="457" y="492" fill="#b4b9c7" font-size="12">Electives</text>
</svg>
