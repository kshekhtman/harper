<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Harper · Four-year course planner</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<header>
  <div class="brand">
    <img src="uchicago-logo.png" alt="University of Chicago" width="108" height="44" onerror="this.remove()" />
    <div>
      <h1>Harper</h1>
      <div class="sub" id="subtitle">Talk through your four years</div>
    </div>
  </div>
  <div class="status-pill" id="pill">No plan loaded</div>
</header>

<main>
  <section>
    <div class="grid" id="grid"></div>
    <div class="tray" id="tray"><h3>Unscheduled</h3><div class="cards" id="traycards"></div></div>
    <div class="legend" id="legend"></div>
  </section>

  <aside>
    <div class="panel">
      <button id="talk"><span class="orb"></span><span id="talklabel">Talk to Harper</span></button>
      <div id="mode">Click and allow microphone access</div>
    </div>
    <div class="panel"><h2>Conversation</h2><div id="log"></div></div>
    <div class="panel"><h2>Plan audit</h2><ul id="problems" class="empty"><li>Load a major to begin.</li></ul></div>
    <div class="panel">
      <details>
        <summary>Manual controls</summary>
        <div>
          <button data-t='["load_major",{"major":"CS"}]'>Load CS</button>
          <button data-t='["load_major",{"major":"Econ"}]'>Load Econ</button>
          <button data-t='["set_study_abroad",{"quarter":"Y3-Autumn"}]'>Abroad Y3-Autumn</button>
          <button data-t='["mark_course_closed",{"course_id":"CMSC 14300"}]'>Close CMSC 14300</button>
          <button data-t='["mark_course_closed",{"course_id":"ECON 20100"}]'>Close ECON 20100</button>
          <button data-t='["move_course",{"course_id":"SOSC 1","to_quarter":"Y1-Winter"}]'>Move SOSC 1 to Y1-Winter</button>
          <button data-t='["auto_fix",{}]'>Auto-fix</button>
        </div>
      </details>
    </div>
  </aside>
</main>
<footer>Sample course data based on the UChicago College Catalog, simplified for demo purposes. Not official advising.</footer>

<script src="catalog.js"></script>
<script src="planner.js"></script>
<script type="module">

  // ======== PASTE YOUR ELEVENLABS AGENT ID HERE ========
  const AGENT_ID = "agent_8001m55rpa9nejzsf0wm3jdt3maq";
  // =====================================================

  const P = window.Planner.createPlanner(window.CATALOG);
  const COLORS = { CS: "#38bdf8", ECON: "#f59e0b", MATH: "#818cf8", STAT: "#c084fc", HUM: "#fb7185", SOSC: "#e879f9",
                   CIV: "#2dd4bf", ARTS: "#facc15", BIO: "#4ade80", PHYS: "#60a5fa", ELECTIVE: "#94a3b8" };
  const YEARS = ["First year", "Second year", "Third year", "Fourth year"];
  let lastBad = new Set();

  // UChicago students say "CMSC 141", not "CMSC 14100"
  const short = s => String(s).replace(/\b([A-Z]{3,4}) (\d{3})00\b/g, "$1 $2");

  const $ = id => document.getElementById(id);
  $("legend").innerHTML = Object.entries(COLORS).map(([k, c]) => `<span><i style="background:${c}"></i>${k}</span>`).join("");

  function cardHTML(id, issues, changed, fixed) {
    const c = P.courses[id];
    const cls = ["card", issues ? "bad" : "", changed ? "changed" : "", fixed ? "fixed" : ""].join(" ");
    return `<div class="${cls}" data-id="${id}" style="--c:${COLORS[c.category] || "#666"}">
      <div class="id">${short(id)}</div><div class="t">${c.title}</div>
      ${issues ? `<div class="why" title="${short(issues.join("; "))}">${short(issues.join("; "))}</div>` : ""}</div>`;
  }

  function render() {
    // remember where each card was so we can animate it to its new spot
    const first = {};
    document.querySelectorAll(".card").forEach(el => (first[el.dataset.id] = el.getBoundingClientRect()));

    const s = P.state, v = P.validate(), changed = new Set(s.changed);
    const bad = new Set(Object.keys(v.courseIssues));
    let html = `<div></div>` + P.SEASONS.map(x => `<div class="colhead">${x}</div>`).join("");
    for (let y = 1; y <= 4; y++) {
      html += `<div class="rowhead"><b>Year ${y}</b>${YEARS[y - 1]}</div>`;
      for (const season of P.SEASONS) {
        const q = `Y${y}-${season}`, warn = v.quarterWarnings[q], abroad = s.abroad === q;
        html += `<div class="cell ${warn ? "warn" : ""} ${abroad ? "abroad" : ""}">
          <div class="cellhead"><span>${P.hoursIn(q)} hrs / week</span>
            <span>${abroad ? '<span class="badge abroad">Study abroad</span>' : ""} ${warn ? `<span class="badge warn">Heavy load</span>` : ""}</span></div>
          <div class="cards">${s.plan[q].map(id => cardHTML(id, v.courseIssues[id], changed.has(id), lastBad.has(id) && !bad.has(id))).join("")}</div></div>`;
      }
    }
    $("grid").innerHTML = html;
    $("traycards").innerHTML = s.tray.map(id => cardHTML(id, ["unscheduled"], changed.has(id))).join("");
    $("tray").classList.toggle("has", s.tray.length > 0);
    lastBad = new Set([...bad, ...s.tray]);

    const hard = Object.keys(v.courseIssues).length + s.tray.length;
    const pill = $("pill");
    if (!s.major) { pill.textContent = "No plan loaded"; pill.className = "status-pill"; }
    else if (hard) { pill.textContent = `${hard} issue${hard > 1 ? "s" : ""} to resolve`; pill.className = "status-pill invalid"; }
    else { pill.textContent = "On track to graduate"; pill.className = "status-pill valid"; }

    const items = [];
    Object.entries(v.courseIssues).forEach(([id, ps]) => items.push(`<li>${id}: ${ps.join("; ")}</li>`));
    s.tray.forEach(id => items.push(`<li>${id} needs a new quarter</li>`));
    Object.entries(v.quarterWarnings).forEach(([q, ws]) => items.push(`<li class="w">${q}: ${ws.join("; ")}</li>`));
    const ul = $("problems");
    ul.className = items.length || !s.major ? "" : "empty";
    ul.innerHTML = s.major ? (short(items.join("")) || "<li>All prerequisites and offerings check out.</li>") : "<li>Load a major to begin.</li>";

    // slide cards from old position to new
    document.querySelectorAll(".card").forEach(el => {
      const f = first[el.dataset.id], l = el.getBoundingClientRect();
      if (!f) { el.animate([{ opacity: 0, transform: "scale(.85)" }, { opacity: 1, transform: "none" }], { duration: 450, easing: "ease-out" }); return; }
      const dx = f.left - l.left, dy = f.top - l.top;
      if (Math.abs(dx) + Math.abs(dy) > 2) el.animate([{ transform: `translate(${dx}px,${dy}px)`, zIndex: 10 }, { transform: "none" }], { duration: 700, easing: "cubic-bezier(.2,.8,.2,1)" });
    });
  }

  function log(kind, text) {
    const d = document.createElement("div");
    d.className = `msg ${kind}`; d.textContent = text;
    $("log").appendChild(d); $("log").scrollTop = $("log").scrollHeight;
  }

  // Each tool runs, redraws the grid, logs, and sends JSON back to the agent.
  const clientTools = {};
  Object.entries(P.tools).forEach(([name, fn]) => {
    clientTools[name] = async (params = {}) => {
      const res = fn(params || {});
      render();
      log("tool", short(`${name.replace(/_/g, " ")}${Object.keys(params || {}).length ? " · " + Object.values(params).join(", ") : ""}`));
      return short(JSON.stringify(res));
    };
  });
  window.QT = clientTools;

  document.querySelectorAll("details button").forEach(b => b.onclick = () => { const [n, a] = JSON.parse(b.dataset.t); clientTools[n](a); });

  // voice
  let convo = null;
  const talk = $("talk");
  talk.onclick = async () => {
    if (convo) { await convo.endSession(); return; }
    if (AGENT_ID.startsWith("PASTE")) { alert("Paste your ElevenLabs Agent ID into index.html (AGENT_ID)."); return; }
    try {
      $("mode").textContent = "Connecting…";
      const { Conversation } = await import("https://cdn.jsdelivr.net/npm/@elevenlabs/client/+esm");
      await navigator.mediaDevices.getUserMedia({ audio: true });
      convo = await Conversation.startSession({
        agentId: AGENT_ID,
        clientTools,
        onConnect: () => { talk.classList.add("live"); $("talklabel").textContent = "End conversation"; $("mode").textContent = "Listening…"; },
        onDisconnect: () => { convo = null; talk.className = ""; $("talklabel").textContent = "Talk to Harper"; $("mode").textContent = "Disconnected"; },
        onMessage: ({ message, source }) => log(source === "user" ? "user" : "ai", message),
        onModeChange: ({ mode }) => { talk.classList.toggle("speaking", mode === "speaking"); $("mode").textContent = mode === "speaking" ? "Harper is speaking…" : "Listening…"; },
        onError: (e) => { console.error(e); $("mode").textContent = "Error: " + (e?.message || e); }
      });
    } catch (e) { console.error(e); $("mode").textContent = "Couldn't connect: " + e.message; }
  };

  P.onChange(() => {});
  render();
</script>
</body>
</html>
